name: Render Heartbeat

on:
  schedule:
    - cron: '59 * * * *'  # every hour at :59
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sf https://chatapp-v2-backend.onrender.com/api/health || echo "Backend ping failed"
