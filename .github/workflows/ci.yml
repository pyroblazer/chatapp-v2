name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  backend-test:
    name: Backend Tests (${{ matrix.test-group }})
    runs-on: ubuntu-latest
    needs: backend-lint
    strategy:
      matrix:
        test-group: [auth, conversations, messages, health]
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chatapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: test
      DATABASE_PASSWORD: test
      DATABASE_NAME: chatapp_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test -- --ci --maxWorkers=2 --testPathPattern="${{ matrix.test-group }}"

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  e2e-tests:
    name: E2E Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: auth
            specs: "tests/e2e/auth.spec.ts tests/e2e/auth-edge-cases.spec.ts tests/e2e/registration-validation.spec.ts"
          - group: calls-presence
            specs: "tests/e2e/calls.spec.ts tests/e2e/online-presence.spec.ts"
          - group: conversations
            specs: "tests/e2e/conversations.spec.ts tests/e2e/conversation-edge-cases.spec.ts tests/e2e/create-conversation-modal.spec.ts"
          - group: messages
            specs: "tests/e2e/messages.spec.ts tests/e2e/message-edge-cases.spec.ts tests/e2e/real-time-messages.spec.ts tests/e2e/message-attachments.spec.ts"
          - group: friends
            specs: "tests/e2e/friends.spec.ts tests/e2e/friend-management.spec.ts tests/e2e/friend-request-edge-cases.spec.ts"
          - group: groups
            specs: "tests/e2e/groups.spec.ts tests/e2e/group-management.spec.ts tests/e2e/group-messages.spec.ts tests/e2e/group-edge-cases.spec.ts tests/e2e/create-group-modal.spec.ts"
          - group: profile
            specs: "tests/e2e/profile.spec.ts tests/e2e/profile-update.spec.ts tests/e2e/profile-edge-cases.spec.ts tests/e2e/settings.spec.ts"
          - group: misc
            specs: "tests/e2e/navigation.spec.ts tests/e2e/search.spec.ts tests/e2e/global-search.spec.ts tests/e2e/reactions.spec.ts tests/e2e/notifications.spec.ts tests/e2e/read-receipts.spec.ts tests/e2e/typing-indicators.spec.ts tests/e2e/emoji-picker.spec.ts tests/e2e/blocked.spec.ts tests/e2e/block-effects.spec.ts tests/e2e/error-handling.spec.ts"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright
        run: bunx playwright install --with-deps
      - name: Start Docker services
        run: docker compose up --build -d
      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:80/api/health > /dev/null; do sleep 5; done'
      - name: Seed database
        run: docker compose run --rm backend-seed
      - name: Run E2E tests (${{ matrix.group }})
        run: BASE_URL=http://localhost:80 bunx playwright test ${{ matrix.specs }} --workers=100% --fully-parallel
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t chatapp-backend-test apps/backend
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t chatapp-frontend-test apps/frontend
