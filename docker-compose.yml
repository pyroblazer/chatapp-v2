services:
  postgres:
    image: postgres:16-alpine
    container_name: chatapp-postgres
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatapp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chatapp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatapp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: chatapp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chatapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-chatapp_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../docker/backend.Dockerfile
    container_name: chatapp-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DATABASE_USERNAME:-chatapp}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-chatapp_secret}
      - DATABASE_NAME=${DATABASE_NAME:-chatapp}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-chatapp}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-chatapp_secret}
      - UPLOADTHING_TOKEN=${UPLOADTHING_TOKEN}
      - UPLOADTHING_APP_ID=${UPLOADTHING_APP_ID}
      - UPLOADTHING_SECRET=${UPLOADTHING_SECRET}
      - LOCAL_STORAGE_DIR=/app/uploads
      - LOCAL_STORAGE_BASE_URL=/api/storage/local
      - OLLAMA_HOST=http://ollama:11434
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost,http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - ./docker/backend-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend-seed:
    build:
      context: ./apps/backend
      dockerfile: ../../docker/backend.Dockerfile
      target: development
    container_name: chatapp-backend-seed
    restart: "no"
    env_file:
      - .env.docker
    environment:
      - PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=${DATABASE_USERNAME:-chatapp}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-chatapp_secret}
      - DATABASE_NAME=${DATABASE_NAME:-chatapp}
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-admin}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-changeme123!}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-admin@chatapp.local}
    depends_on:
      backend:
        condition: service_healthy
    command: ["bun", "run", "seed"]

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../docker/frontend.Dockerfile
    container_name: chatapp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: chatapp-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 && echo ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    container_name: chatapp-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "llama2"]
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: chatapp-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_uploads:
  ollama_data:
